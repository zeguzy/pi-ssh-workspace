name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint README
        run: npx --yes markdownlint-cli2 README.md README.zh-CN.md

      - name: Verify the published tarball is loadable
        run: |
          npm pack --silent
          mkdir -p /tmp/packed
          tar xzf pi-ssh-workspace-*.tgz -C /tmp/packed
          npm install -g @earendil-works/pi-coding-agent
          pi --no-extensions -e /tmp/packed/package --help | grep -q -- '--ssh-cwd'
          echo "packed extension registers --ssh and --ssh-cwd"
